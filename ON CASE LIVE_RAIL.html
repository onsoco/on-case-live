/* ON: CASE LIVE welcome screen */
body.cover-mode{background:#f5f0e6;color:#1d3349}
.cover-mode>.wrap{max-width:none;padding:0}
.cover-mode>.wrap>.top,.cover-mode>.wrap>.nav,.cover-mode>.wrap>footer{display:none}
.cover{min-height:100svh;position:relative;overflow:hidden;padding:30px clamp(22px,6vw,100px) 25px;background:radial-gradient(ellipse at 88% 22%,#e8dcc080,transparent 52%),#f5f0e6}
.cover:before{content:'';position:absolute;width:600px;height:600px;border:1px solid #d6c9ab80;border-radius:50%;right:-240px;top:160px;pointer-events:none}
.cover-top{position:relative;display:flex;justify-content:space-between;gap:20px;align-items:center;max-width:1320px;margin:auto}
.coop-mark{width:clamp(235px,29vw,370px);background:white;border-radius:12px;padding:15px 16px;border:1px solid #e3ddd0}
.coop-window{position:relative;overflow:hidden;width:100%;aspect-ratio:4.65}
.coop-window img{position:absolute;width:100%;height:auto;left:0;top:50%;transform:translateY(-50%)}
.cover-label{font-size:17px;font-weight:700;letter-spacing:2px;color:#526252;display:flex;gap:10px;align-items:center}
.cover-label:before{content:'';width:9px;height:9px;border-radius:50%;background:#c28a2d;box-shadow:0 0 0 5px #c28a2d15}
.cover-grid{position:relative;display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(35px,6vw,100px);align-items:center;max-width:1320px;margin:clamp(40px,7vh,85px) auto 48px}
.cover-kicker{font-size:18px;letter-spacing:3px;font-weight:700;color:#657064;margin-bottom:22px}
.cover-title{font-family:Arial,sans-serif;font-size:clamp(64px,7.5vw,116px);font-weight:900;letter-spacing:-6px;line-height:.98;margin:0 0 28px;color:#1c334b}
.cover-title span{display:block}.cover-title .live-word{color:#ac772b;letter-spacing:1px;margin-top:7px}
.cover-subtitle{font-size:clamp(26px,2.7vw,39px);font-weight:800;letter-spacing:-1.4px;line-height:1.4;margin-bottom:22px;color:#1c334b}
.cover-description{font-size:23px;line-height:1.8;color:#506051;margin-bottom:30px;max-width:540px}
.cover-start{background:#1c334b;color:#fff;border:2px solid #1c334b;border-radius:16px;font-size:27px;padding:20px 27px;min-width:300px;min-height:82px;display:flex;justify-content:space-between;gap:45px;align-items:center;box-shadow:0 9px 20px #1c334b14}
.cover-start:hover{background:#2e4a65;border-color:#2e4a65}.cover-start span:last-child{color:#f5bf5d;font-size:32px}
.cover-note{font-size:18px;color:#626b60;margin-top:16px}
.mission-display{position:relative;background:#20394f;color:#fff8ed;border-radius:30px;padding:33px;box-shadow:0 25px 55px #1c334b20;transform:rotate(2deg);border:1px solid #314b5e}
.mission-display:before{content:'';position:absolute;inset:12px;border:1px solid #a6b2af35;border-radius:21px;pointer-events:none}
.display-head{display:flex;align-items:center;justify-content:space-between;font-size:16px;letter-spacing:2px;color:#d3d9cf;margin:0 0 30px}
.display-chip{border:1px solid #d6ab6255;padding:5px 10px;border-radius:20px;color:#f3c778;letter-spacing:1px;font-size:14px}
.display-art{position:relative;margin:10px auto 20px;max-width:220px;height:210px;display:flex;align-items:center;justify-content:center}
.display-art:before{content:'';position:absolute;width:190px;height:190px;border-radius:50%;background:#f7bc5420;border:1px solid #f7bc5440}
.display-art svg{position:relative;width:152px;height:175px}.display-art .art-plus{position:absolute;font-size:30px;color:#f3bf65;right:5px;top:15px}
.display-title{font-size:30px;text-align:center;font-weight:800;margin:10px 0 26px;line-height:1.4}
.display-list{border-top:1px solid #ffffff25}.display-row{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid #ffffff25;font-size:23px}.display-row .num{color:#f3c778;font-size:16px;margin-right:15px}.display-row .arrow{color:#b4c5bb}
.display-bottom{font-size:17px;color:#ced8cd;text-align:center;margin-top:23px}
.cover-bottom{position:relative;max-width:1320px;margin:auto;border-top:1px solid #cfc7b6;display:flex;justify-content:space-between;gap:15px;padding-top:20px;font-size:18px;color:#647062;flex-wrap:wrap}.cover-bottom strong{color:#365345;font-weight:700}
@media(min-width:1600px){.cover-grid{margin-top:100px;margin-bottom:80px}}
@media(max-width:850px){.cover{padding:24px 22px}.cover-grid{grid-template-columns:1fr;gap:38px;margin-top:45px}.cover-title{font-size:80px}.mission-display{transform:none;max-width:540px;width:100%;margin:auto}.cover-label{display:none}.cover-start{width:100%;max-width:500px}.cover-subtitle{font-size:31px}.cover-description{font-size:23px}.cover-top{justify-content:flex-start}.cover-bottom{margin-top:30px}}
@media(max-width:390px){.cover-title{font-size:65px;letter-spacing:-4px}.cover-subtitle{font-size:27px}.cover-start{min-width:0;font-size:24px}.mission-display{padding:27px}.display-title{font-size:26px}}

/* Portrait welcome layout */
.cover{min-height:100svh;max-width:820px;margin:0 auto;padding:32px clamp(24px,6vw,65px) 25px}
.cover:before{width:480px;height:480px;right:-320px;top:250px}
.cover-top{justify-content:center}.cover-label{display:none}
.coop-mark{width:clamp(250px,55vw,370px)}
.cover-grid{display:flex;flex-direction:column;align-items:center;gap:0;margin:48px auto 40px;text-align:center}
.cover-grid>div{width:100%}.cover-kicker{font-size:18px;margin-bottom:24px}
.cover-title{font-size:clamp(62px,11vw,100px);letter-spacing:-4px;line-height:1.05;margin-bottom:25px}
.cover-title .live-word{letter-spacing:3px;margin-top:9px}
.cover-subtitle{font-size:clamp(27px,4.6vw,36px);letter-spacing:-1px}
.cover-description{margin:20px auto 30px;font-size:23px}
.cover-start{width:100%;max-width:480px;margin:0 auto;min-width:0}
.cover-note{font-size:19px}.cover-bottom{justify-content:center;text-align:center;font-size:18px;gap:8px}
.cover-bottom>*{width:100%}
@media(min-width:851px){body.cover-mode{background:#e9e4d9}.cover{box-shadow:0 0 80px #1c334b0a}}
@media(max-width:390px){.cover{padding:25px 20px}.cover-title{font-size:60px;letter-spacing:-3px}.cover-description{font-size:22px}.cover-start{font-size:24px}.cover-grid{margin-top:37px}}

/* Footer logo without a background panel */
.cover-logo{position:relative;display:flex;justify-content:center;margin:25px auto 28px}
.cover-logo .coop-mark{background:transparent;border:0;box-shadow:none;border-radius:0;padding:0;width:clamp(245px,48vw,340px);mix-blend-mode:multiply}

.cover-grid{margin-top:28px;margin-bottom:30px}
.cover{padding-top:35px}
@media(max-width:850px){.cover-grid{margin-top:12px;margin-bottom:28px}.cover-logo{margin-top:24px;margin-bottom:25px}.cover-bottom{margin-top:0}}

&lt;body class=&quot;min-h-screen flex items-center justify-center p-0 sm:p-4 text-gray-800&quot;&gt;

    &lt;!-- Mobile Screen Frame Container --&gt;
    &lt;div class=&quot;w-full max-w-md bg-white min-h-screen sm:min-h-[840px] sm:h-[840px] sm:rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden relative border-0 sm:border-8 border-gray-900&quot;&gt;
        
        &lt;!-- Header Section --&gt;
        &lt;header class=&quot;bg-rail-darkBlue text-white p-4 shadow-md flex items-center justify-between sticky top-0 z-30&quot;&gt;&lt;button class=&quot;on-cover-link&quot; onclick=&quot;window.parent.showCover()&quot;&gt;← 교육 첫 화면&lt;/button&gt;
            &lt;div class=&quot;flex items-center space-x-2&quot;&gt;

        &lt;/header&gt;

                &lt;span&gt;열차&lt;/span&gt;
            &lt;/div&gt;
            &lt;i class=&quot;fa-solid fa-chevron-right text-gray-300 self-center text-[10px]&quot;&gt;&lt;/i&gt;
            &lt;div id=&quot;stepDot3&quot; class=&quot;step-item flex items-center gap-1&quot;&gt;
                &lt;span class=&quot;w-4 h-4 rounded-full bg-gray-300 text-white flex items-center justify-center text-[10px]&quot;&gt;3&lt;/span&gt;

        &lt;/nav&gt;

        &lt;!-- Main Content Area --&gt;
        &lt;main class=&quot;flex-1 overflow-y-auto p-4 space-y-5 relative&quot;&gt;&lt;div class=&quot;on-training&quot;&gt;&lt;strong&gt;기차 예매, 천천히 연습해요.&lt;/strong&gt;&lt;br&gt;조회 → 열차 → 좌석 → 결제 → 발권 순서로 진행해요. 실제 예매나 결제는 발생하지 않습니다. 시간·운임·할인은 학습용 예시입니다.&lt;/div&gt;

            &lt;!-- STEP 1: 여정 및 인원 선택 --&gt;
            &lt;section id=&quot;step1&quot; class=&quot;space-y-5&quot;&gt;
                &lt;!-- 출발지 / 도착지 선택 카드 --&gt;
                &lt;div class=&quot;bg-white border-2 border-blue-100 rounded-2xl p-4 shadow-sm relative&quot;&gt;
                    &lt;div class=&quot;grid grid-cols-2 gap-4 items-center text-center&quot;&gt;
                        &lt;div class=&quot;bg-blue-50/60 p-3 rounded-xl border border-blue-100&quot;&gt;

                            &lt;select id=&quot;departureStation&quot; onchange=&quot;updateStations()&quot; class=&quot;text-2xl font-black bg-transparent w-full text-center focus:outline-none cursor-pointer text-gray-900&quot;&gt;
                                &lt;option value=&quot;서울&quot; selected=&quot;&quot;&gt;서울&lt;/option&gt;
                                &lt;option value=&quot;동대구&quot;&gt;동대구&lt;/option&gt;
                                &lt;option value=&quot;대전&quot;&gt;대전&lt;/option&gt;
                                &lt;option value=&quot;부산&quot;&gt;부산&lt;/option&gt;
                                &lt;option value=&quot;광주송정&quot;&gt;광주송정&lt;/option&gt;
                                &lt;option value=&quot;강릉&quot;&gt;강릉&lt;/option&gt;
                            &lt;/select&gt;
                        &lt;/div&gt;

                        &lt;!-- 위치 스왑 버튼 --&gt;
                        &lt;button onclick=&quot;swapStations()&quot; class=&quot;absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-rail-blue text-white w-10 h-10 rounded-full shadow-lg border-2 border-white flex items-center justify-center active:scale-95 transition-transform&quot;&gt;
                            &lt;i class=&quot;fa-solid fa-arrows-rotate text-base&quot;&gt;&lt;/i&gt;
                        &lt;/button&gt;

                        &lt;div class=&quot;bg-blue-50/60 p-3 rounded-xl border border-blue-100&quot;&gt;
                            &lt;span class=&quot;text-xs font-bold text-rail-blue uppercase tracking-wider block mb-1&quot;&gt;도착역&lt;/span&gt;
                            &lt;select id=&quot;arrivalStation&quot; onchange=&quot;updateStations()&quot; class=&quot;text-2xl font-black bg-transparent w-full text-center focus:outline-none cursor-pointer text-gray-900&quot;&gt;
                                &lt;option value=&quot;서울&quot;&gt;서울&lt;/option&gt;
                                &lt;option value=&quot;동대구&quot;&gt;동대구&lt;/option&gt;
                                &lt;option value=&quot;대전&quot;&gt;대전&lt;/option&gt;
                                &lt;option value=&quot;부산&quot; selected=&quot;&quot;&gt;부산&lt;/option&gt;
                                &lt;option value=&quot;광주송정&quot;&gt;광주송정&lt;/option&gt;
                                &lt;option value=&quot;강릉&quot;&gt;강릉&lt;/option&gt;
                            &lt;/select&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;!-- 날짜 및 시간대 선택 섹션 --&gt;
                &lt;div class=&quot;bg-white border border-gray-200 rounded-2xl p-4 shadow-sm space-y-3&quot;&gt;
                    &lt;label for=&quot;travelDate&quot; class=&quot;text-sm font-bold text-gray-700 flex items-center gap-2&quot;&gt;

                    &lt;div class=&quot;grid grid-cols-2 gap-2&quot;&gt;
                        &lt;input type=&quot;date&quot; id=&quot;travelDate&quot; class=&quot;w-full text-base font-bold p-3 bg-gray-50 border-2 border-gray-300 rounded-xl focus:border-rail-blue focus:outline-none text-gray-800&quot; min=&quot;2026-11-05&quot;&gt;
                        &lt;select id=&quot;travelTime&quot; class=&quot;w-full text-base font-bold p-3 bg-gray-50 border-2 border-gray-300 rounded-xl focus:border-rail-blue focus:outline-none text-gray-800&quot;&gt;

                            &lt;option value=&quot;08:00&quot; selected=&quot;&quot;&gt;08:00 이후&lt;/option&gt;
                            &lt;option value=&quot;10:00&quot;&gt;10:00 이후&lt;/option&gt;
                            &lt;option value=&quot;12:00&quot;&gt;12:00 이후&lt;/option&gt;
                            &lt;option value=&quot;14:00&quot;&gt;14:00 이후&lt;/option&gt;
                            &lt;option value=&quot;16:00&quot;&gt;16:00 이후&lt;/option&gt;
                            &lt;option value=&quot;18:00&quot;&gt;18:00 이후&lt;/option&gt;
                        &lt;/select&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;!-- 승객 유형 및 수량 (할인율 표기) --&gt;
                &lt;div class=&quot;bg-white border border-gray-200 rounded-2xl p-4 shadow-sm space-y-3&quot;&gt;
                    &lt;div class=&quot;flex justify-between items-center border-b pb-2&quot;&gt;
                        &lt;h3 class=&quot;font-bold text-base text-gray-800 flex items-center gap-2&quot;&gt;

                        &lt;span class=&quot;text-xs text-rail-accent font-semibold&quot;&gt;* 자동 할인 계산&lt;/span&gt;
                    &lt;/div&gt;

                    &lt;!-- 성인 --&gt;
                    &lt;div class=&quot;flex justify-between items-center py-1&quot;&gt;
                        &lt;div&gt;
                            &lt;div class=&quot;font-bold text-lg text-gray-900&quot;&gt;성인&lt;/div&gt;

                        &lt;div class=&quot;flex items-center gap-3&quot;&gt;
                            &lt;button onclick=&quot;changePassenger(&#x27;adult&#x27;, -1)&quot; class=&quot;w-10 h-10 rounded-full bg-gray-100 border text-xl font-bold text-gray-700 active:bg-gray-300 flex items-center justify-center&quot;&gt;-&lt;/button&gt;

                        &lt;/div&gt;
                    &lt;/div&gt;

                    &lt;!-- 어린이 --&gt;
                    &lt;div class=&quot;flex justify-between items-center py-1 border-t border-gray-100&quot;&gt;
                        &lt;div&gt;
                            &lt;div class=&quot;font-bold text-lg text-gray-900&quot;&gt;어린이 &lt;span class=&quot;text-xs text-red-500 bg-red-50 px-1.5 py-0.5 rounded font-normal&quot;&gt;50% 할인&lt;/span&gt;&lt;/div&gt;
                            &lt;div class=&quot;text-xs text-gray-500&quot;&gt;만 6세 ~ 12세&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;flex items-center gap-3&quot;&gt;
                            &lt;button onclick=&quot;changePassenger(&#x27;child&#x27;, -1)&quot; class=&quot;w-10 h-10 rounded-full bg-gray-100 border text-xl font-bold text-gray-700 active:bg-gray-300 flex items-center justify-center&quot;&gt;-&lt;/button&gt;
                            &lt;span id=&quot;cntChild&quot; class=&quot;text-xl font-black w-6 text-center&quot;&gt;0&lt;/span&gt;
                            &lt;button onclick=&quot;changePassenger(&#x27;child&#x27;, 1)&quot; class=&quot;w-10 h-10 rounded-full bg-rail-lightBlue border border-blue-300 text-xl font-bold text-rail-blue active:bg-blue-200 flex items-center justify-center&quot;&gt;+&lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;

                    &lt;!-- 경로 (시니어) --&gt;
                    &lt;div class=&quot;flex justify-between items-center py-1 border-t border-gray-100&quot;&gt;
                        &lt;div&gt;
                            &lt;div class=&quot;font-bold text-lg text-gray-900&quot;&gt;경로 (시니어) &lt;span class=&quot;text-xs text-red-500 bg-red-50 px-1.5 py-0.5 rounded font-normal&quot;&gt;30% 할인&lt;/span&gt;&lt;/div&gt;
                            &lt;div class=&quot;text-xs text-gray-500&quot;&gt;만 65세 이상&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;flex items-center gap-3&quot;&gt;
                            &lt;button onclick=&quot;changePassenger(&#x27;senior&#x27;, -1)&quot; class=&quot;w-10 h-10 rounded-full bg-gray-100 border text-xl font-bold text-gray-700 active:bg-gray-300 flex items-center justify-center&quot;&gt;-&lt;/button&gt;
                            &lt;span id=&quot;cntSenior&quot; class=&quot;text-xl font-black w-6 text-center&quot;&gt;0&lt;/span&gt;
                            &lt;button onclick=&quot;changePassenger(&#x27;senior&#x27;, 1)&quot; class=&quot;w-10 h-10 rounded-full bg-rail-lightBlue border border-blue-300 text-xl font-bold text-rail-blue active:bg-blue-200 flex items-center justify-center&quot;&gt;+&lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;

                    &lt;!-- 장애인 --&gt;
                    &lt;div class=&quot;flex justify-between items-center py-1 border-t border-gray-100&quot;&gt;
                        &lt;div&gt;
                            &lt;div class=&quot;font-bold text-lg text-gray-900&quot;&gt;장애인 &lt;span class=&quot;text-xs text-red-500 bg-red-50 px-1.5 py-0.5 rounded font-normal&quot;&gt;50% 할인&lt;/span&gt;&lt;/div&gt;
                            &lt;div class=&quot;text-xs text-gray-500&quot;&gt;중증 장애인 및 동반 1인&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;flex items-center gap-3&quot;&gt;
                            &lt;button onclick=&quot;changePassenger(&#x27;disabled&#x27;, -1)&quot; class=&quot;w-10 h-10 rounded-full bg-gray-100 border text-xl font-bold text-gray-700 active:bg-gray-300 flex items-center justify-center&quot;&gt;-&lt;/button&gt;

            &lt;!-- STEP 2: 열차 시간표 선택 --&gt;
            &lt;section id=&quot;step2&quot; class=&quot;space-y-4 hidden&quot;&gt;

                &lt;/div&gt;
            &lt;/section&gt;

            &lt;!-- STEP 3: 좌석 배치도 및 선택 --&gt;
            &lt;section id=&quot;step3&quot; class=&quot;space-y-4 hidden&quot;&gt;
                &lt;div class=&quot;bg-slate-800 text-white p-3 rounded-xl flex justify-between items-center&quot;&gt;

        // Coach occupied seat maps
        const occupiedSeatsMap = {
            &#x27;1호차&#x27;: [&#x27;1C&#x27;, &#x27;2B&#x27;, &#x27;3D&#x27;, &#x27;4C&#x27;, &#x27;5A&#x27;],
            &#x27;2호차&#x27;: [&#x27;1A&#x27;, &#x27;1B&#x27;, &#x27;2D&#x27;, &#x27;4A&#x27;, &#x27;6C&#x27;, &#x27;7B&#x27;],
            &#x27;3호차&#x27;: [&#x27;2A&#x27;, &#x27;3B&#x27;, &#x27;3C&#x27;, &#x27;5D&#x27;, &#x27;6A&#x27;]
        };

        window.onload = function() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, &#x27;0&#x27;);
            const dd = String(today.getDate()).padStart(2, &#x27;0&#x27;);
            document.getElementById(&#x27;travelDate&#x27;).value = `${yyyy}-${mm}-${dd}`;
            document.getElementById(&#x27;travelDate&#x27;).min = `${yyyy}-${mm}-${dd}`;
        };

        function swapStations() {
            const dep = document.getElementById(&#x27;departureStation&#x27;);
            const arr = document.getElementById(&#x27;arrivalStation&#x27;);
            const temp = dep.value;
            dep.value = arr.value;
            arr.value = temp;

            if(dep.value === arr.value) {
                const options = Array.from(arr.options).map(o =&gt; o.value);
                arr.value = options.find(o =&gt; o !== dep.value);
            }
        }

        function updateStations() {
            const dep = document.getElementById(&#x27;departureStation&#x27;).value;
            const arr = document.getElementById(&#x27;arrivalStation&#x27;).value;
            if (dep === arr) {
                showModal(&quot;출발지와 도착지는 서로 다르게 선택해 주세요.&quot;);
                swapStations();
            }
        }

        function changePassenger(type, delta) {
            const currentTotal = getTotalPassengers();
            if (delta &gt; 0 &amp;&amp; currentTotal &gt;= 9) {
                showModal(&quot;최대 9명까지 예매 가능합니다.&quot;);
                return;
            }
            if (passengers[type] + delta &lt; 0) return;
            if (currentTotal + delta &lt;= 0) {
                showModal(&quot;최소 1명 이상의 승객을 선택하셔야 합니다.&quot;);
                return;
            }

            passengers[type] += delta;
            
            document.getElementById(&#x27;cntAdult&#x27;).innerText = passengers.adult;
            document.getElementById(&#x27;cntChild&#x27;).innerText = passengers.child;
            document.getElementById(&#x27;cntSenior&#x27;).innerText = passengers.senior;
            document.getElementById(&#x27;cntDisabled&#x27;).innerText = passengers.disabled;
        }

        function getTotalPassengers() {
            return passengers.adult + passengers.child + passengers.senior + passengers.disabled;
        }

        function calculateTotalPrice(unitPrice) {
            let total = 0;
            total += passengers.adult * unitPrice;
            total += passengers.child * (unitPrice * 0.5);
            total += passengers.senior * (unitPrice * 0.7);
            total += passengers.disabled * (unitPrice * 0.5);
            return Math.floor(total / 100) * 100;
        }

        function goToStep(step) {
            currentStep = step;
            
            for(let i = 1; i &lt;= 5; i++) {
                document.getElementById(`step${i}`).classList.add(&#x27;hidden&#x27;);
                
                const dot = document.getElementById(`stepDot${i}`);
                if (i &lt;= step) {
                    dot.classList.add(&#x27;text-rail-blue&#x27;);
                    dot.children[0].classList.replace(&#x27;bg-gray-300&#x27;, &#x27;bg-rail-blue&#x27;);
                } else {
                    dot.classList.remove(&#x27;text-rail-blue&#x27;);
                    dot.children[0].classList.replace(&#x27;bg-rail-blue&#x27;, &#x27;bg-gray-300&#x27;);
                }
            }

            const btnBack = document.getElementById(&#x27;btnBack&#x27;);
            if (step &gt; 1 &amp;&amp; step &lt; 5) {
                btnBack.classList.remove(&#x27;hidden&#x27;);
            } else {
                btnBack.classList.add(&#x27;hidden&#x27;);
            }

            document.getElementById(`step${step}`).classList.remove(&#x27;hidden&#x27;);
        }

        function goBack() {
            if (currentStep &gt; 1 &amp;&amp; currentStep &lt; 5) {
                goToStep(currentStep - 1);
            }
        }

        function searchTrains() {
            const dep = document.getElementById(&#x27;departureStation&#x27;).value;
            const arr = document.getElementById(&#x27;arrivalStation&#x27;).value;
            const routeKey = `${dep}-${arr}`;
            const reverseRouteKey = `${arr}-${dep}`;
            baseTicketPrice = stationPrices[routeKey] || stationPrices[reverseRouteKey] || 45000;

            document.getElementById(&#x27;routeSummary&#x27;).innerText = `${dep} ➔ ${arr}`;
            
            let passengerStr = [];
            if(passengers.adult &gt; 0) passengerStr.push(`성인 ${passengers.adult}`);
            if(passengers.child &gt; 0) passengerStr.push(`어린이 ${passengers.child}`);
            if(passengers.senior &gt; 0) passengerStr.push(`경로 ${passengers.senior}`);
            if(passengers.disabled &gt; 0) passengerStr.push(`장애인 ${passengers.disabled}`);
            document.getElementById(&#x27;passengerSummary&#x27;).innerText = passengerStr.join(&#x27;, &#x27;);

            const trainData = [
                { name: &#x27;KTX 011&#x27;, depTime: &#x27;08:00&#x27;, arrTime: &#x27;10:36&#x27;, type: &#x27;KTX&#x27;, duration: &#x27;2시간 36분&#x27;, seatsLeft: 42 },
                { name: &#x27;SRT 315&#x27;, depTime: &#x27;09:15&#x27;, arrTime: &#x27;11:45&#x27;, type: &#x27;SRT&#x27;, duration: &#x27;2시간 30분&#x27;, seatsLeft: 18 },
                { name: &#x27;KTX-이음&#x27;, depTime: &#x27;11:00&#x27;, arrTime: &#x27;13:40&#x27;, type: &#x27;KTX&#x27;, duration: &#x27;2시간 40분&#x27;, seatsLeft: 55 },
                { name: &#x27;무궁화호 1201&#x27;, depTime: &#x27;12:20&#x27;, arrTime: &#x27;17:10&#x27;, type: &#x27;무궁화&#x27;, duration: &#x27;4시간 50분&#x27;, seatsLeft: 8 }
            ];

            const trainListContainer = document.getElementById(&#x27;trainList&#x27;);
            trainListContainer.innerHTML = &#x27;&#x27;;

            trainData.forEach(train =&gt; {
                let trainPrice = baseTicketPrice;
                if(train.type === &#x27;무궁화&#x27;) trainPrice = Math.floor(baseTicketPrice * 0.55);
                const calculatedPrice = calculateTotalPrice(trainPrice);

                const card = document.createElement(&#x27;div&#x27;);
                card.className = &quot;bg-white border-2 border-gray-200 hover:border-rail-blue rounded-2xl p-4 shadow-sm transition cursor-pointer flex flex-col space-y-3&quot;;
                card.onclick = () =&gt; selectTrainSchedule(train, calculatedPrice);
                card.tabIndex = 0;card.setAttribute(&#x27;role&#x27;,&#x27;button&#x27;);card.setAttribute(&#x27;aria-label&#x27;,train.name+&#x27; &#x27;+train.depTime+&#x27; 출발 &#x27;+calculatedPrice.toLocaleString()+&#x27;원 선택&#x27;);card.onkeydown=e=&gt;{if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();card.click();}};

                card.innerHTML = `
                    &lt;div class=&quot;flex justify-between items-center&quot;&gt;
                        &lt;span class=&quot;bg-blue-100 text-rail-darkBlue font-black text-xs px-2.5 py-1 rounded-md&quot;&gt;${train.type}&lt;/span&gt;
                        &lt;span class=&quot;text-xs text-gray-500 font-medium&quot;&gt;${train.name} (${train.duration})&lt;/span&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;flex justify-between items-center&quot;&gt;
                        &lt;div class=&quot;text-left&quot;&gt;
                            &lt;div class=&quot;text-2xl font-black text-gray-900&quot;&gt;${train.depTime}&lt;/div&gt;
                            &lt;div class=&quot;text-xs text-gray-500 font-bold&quot;&gt;${dep}&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;i class=&quot;fa-solid fa-arrow-right text-gray-400 text-lg&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;text-right&quot;&gt;
                            &lt;div class=&quot;text-2xl font-black text-gray-900&quot;&gt;${train.arrTime}&lt;/div&gt;
                            &lt;div class=&quot;text-xs text-gray-500 font-bold&quot;&gt;${arr}&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;text-right border-l pl-3 border-gray-200&quot;&gt;
                            &lt;div class=&quot;text-lg font-black text-rail-blue&quot;&gt;${calculatedPrice.toLocaleString()}원&lt;/div&gt;
                            &lt;span class=&quot;text-[11px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full inline-block&quot;&gt;잔여 ${train.seatsLeft}석&lt;/span&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;
                trainListContainer.appendChild(card);
            });

            goToStep(2);
        }

        function selectTrainSchedule(train, price) {
            selectedTrain = { ...train, price: price };
            selectedSeats = [];
            currentCoach = &#x27;1호차&#x27;;

            document.getElementById(&#x27;selectedTrainInfo&#x27;).innerText = `${train.name} (${train.depTime} 출발)`;
            updateCoachButtons();
            updateSeatUI();
            renderSeatMap();
            goToStep(3);
        }

        function selectCoach(coachName) {
            currentCoach = coachName;
            document.getElementById(&#x27;currentCoachText&#x27;).innerText = coachName;
            updateCoachButtons();
            renderSeatMap();
        }

        function updateCoachButtons() {
            [&#x27;1호차&#x27;, &#x27;2호차&#x27;, &#x27;3호차&#x27;].forEach((c, idx) =&gt; {
                const btn = document.getElementById(`coachBtn${idx + 1}`);
                if(c === currentCoach) {
                    btn.className = &quot;coach-btn px-3 py-1 text-xs font-bold rounded-lg border bg-rail-blue text-white&quot;;
                } else {
                    btn.className = &quot;coach-btn px-3 py-1 text-xs font-bold rounded-lg border bg-white text-gray-700&quot;;
                }
            });
        }


        function seatDirection(seatId) {
            const row = parseInt(seatId, 10);
            return Math.floor((row - 1) / 2) % 2 === 0 ? &#x27;순방향&#x27; : &#x27;역방향&#x27;;
        }
        function describeSeat(fullSeatId) {
            const seatId = fullSeatId.split(&#x27; &#x27;).pop();
            return fullSeatId + &#x27; (&#x27; + seatDirection(seatId) + &#x27;)&#x27;;
        }

        function renderSeatMap() {
            const seatMapContainer = document.getElementById(&#x27;seatMap&#x27;);
            seatMapContainer.innerHTML = &#x27;&#x27;;

            const occupiedSeats = occupiedSeatsMap[currentCoach] || [];
            const rows = 8;
            const cols = [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;AISLE&#x27;, &#x27;C&#x27;, &#x27;D&#x27;];

            for (let r = 1; r &lt;= rows; r++) {
                cols.forEach(c =&gt; {
                    if (c === &#x27;AISLE&#x27;) {
                        const aisleLabel = document.createElement(&#x27;div&#x27;);
                        aisleLabel.className = &#x27;text-xs font-bold text-gray-400&#x27;;
                        aisleLabel.innerText = `${r}열`;
                        seatMapContainer.appendChild(aisleLabel);
                    } else {
                        const seatId = `${r}${c}`;
                        const direction = seatDirection(seatId);
                        const directionMark = direction === &#x27;순방향&#x27; ? &#x27;↑ 순방향&#x27; : &#x27;↓ 역방향&#x27;;
                        const isOccupied = occupiedSeats.includes(seatId);
                        const isSelected = selectedSeats.includes(`${currentCoach} ${seatId}`);

                        const seatBtn = document.createElement(&#x27;button&#x27;);
                        
                        if (isOccupied) {
                            // 찬 자리 (예약불가 - 회색)
                            seatBtn.className = &quot;h-12 rounded-xl bg-gray-200 text-gray-400 font-bold text-xs border border-gray-300 cursor-not-allowed flex flex-col items-center justify-center&quot;;
                            seatBtn.disabled = true;
                            seatBtn.innerHTML = `&lt;span&gt;${seatId}&lt;/span&gt;&lt;span class=&quot;text-[9px]&quot;&gt;찬자리&lt;/span&gt;&lt;span class=&quot;seat-direction&quot;&gt;${directionMark}&lt;/span&gt;`;
                        } else if (isSelected) {
                            // 선택한 자리 (파란색)
                            seatBtn.id = `seat-${seatId}`;
                            seatBtn.className = &quot;h-12 rounded-xl bg-rail-blue text-white font-black text-sm border-2 border-blue-800 shadow-md flex flex-col items-center justify-center cursor-pointer&quot;;
                            seatBtn.innerHTML = `&lt;span&gt;${seatId}&lt;/span&gt;&lt;span class=&quot;text-[9px]&quot;&gt;선택됨&lt;/span&gt;&lt;span class=&quot;seat-direction&quot;&gt;${directionMark}&lt;/span&gt;`;
                            seatBtn.onclick = () =&gt; toggleSeatSelection(seatId);
                        } else {
                            // 빈자리 (초록색)
                            seatBtn.id = `seat-${seatId}`;
                            seatBtn.className = &quot;h-12 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-black text-sm border-2 border-emerald-600 shadow-sm active:scale-95 transition-transform flex flex-col items-center justify-center cursor-pointer&quot;;
                            seatBtn.innerHTML = `&lt;span&gt;${seatId}&lt;/span&gt;&lt;span class=&quot;text-[9px]&quot;&gt;빈자리&lt;/span&gt;&lt;span class=&quot;seat-direction&quot;&gt;${directionMark}&lt;/span&gt;`;
                            seatBtn.onclick = () =&gt; toggleSeatSelection(seatId);
                        }
                        seatBtn.setAttribute(&#x27;aria-label&#x27;,currentCoach+&#x27; &#x27;+seatId+&#x27; &#x27;+direction+&#x27; &#x27;+(isOccupied?&#x27;예약 불가&#x27;:isSelected?&#x27;선택됨&#x27;:&#x27;선택 가능&#x27;));
                        seatMapContainer.appendChild(seatBtn);
                    }
                });
            }
        }

        function toggleSeatSelection(seatId) {
            const fullSeatId = `${currentCoach} ${seatId}`;
            const totalNeeded = getTotalPassengers();
            const index = selectedSeats.indexOf(fullSeatId);

            if (index &gt; -1) {
                selectedSeats.splice(index, 1);
            } else {
                if (selectedSeats.length &gt;= totalNeeded) {
                    showModal(`선택하신 승객 인원수(${totalNeeded}명)를 초과할 수 없습니다.`);
                    return;
                }
                selectedSeats.push(fullSeatId);
            }

            updateSeatUI();
            renderSeatMap();
        }

        function autoAssignSeats() {
            const totalNeeded = getTotalPassengers();
            selectedSeats = [];
            const occupiedSeats = occupiedSeatsMap[currentCoach] || [];
            const cols = [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;];

            for (let r = 1; r &lt;= 8; r++) {
                for (let c of cols) {
                    const seatId = `${r}${c}`;
                    if (!occupiedSeats.includes(seatId)) {
                        selectedSeats.push(`${currentCoach} ${seatId}`);
                        if (selectedSeats.length === totalNeeded) break;
                    }
                }
                if (selectedSeats.length === totalNeeded) break;
            }

            showModal(`${totalNeeded}개 좌석이 자동으로 배치되었습니다.`);
            updateSeatUI();
            renderSeatMap();
        }

        function updateSeatUI() {
            const totalNeeded = getTotalPassengers();
            const count = selectedSeats.length;
            
            document.getElementById(&#x27;seatSelectionStatus&#x27;).innerText = `좌석 선택: ${count} / ${totalNeeded}석`;
            document.getElementById(&#x27;totalPriceDisplay&#x27;).innerText = `${selectedTrain ? selectedTrain.price.toLocaleString() : 0}원`;

            const btnConfirm = document.getElementById(&#x27;btnConfirmSeats&#x27;);
            const btnText = document.getElementById(&#x27;btnConfirmText&#x27;);

            if (count === totalNeeded) {
                btnConfirm.disabled = false;
                btnConfirm.className = &quot;w-full bg-rail-blue hover:bg-rail-darkBlue text-white font-extrabold text-xl py-4 rounded-2xl shadow-lg transition duration-200 active:scale-[0.98] flex items-center justify-center gap-2 cursor-pointer&quot;;
                btnText.innerText = &quot;결제 단계로 이동하기&quot;;
            } else {
                btnConfirm.disabled = true;
                btnConfirm.className = &quot;w-full bg-gray-400 text-white font-extrabold text-xl py-4 rounded-2xl shadow-lg transition duration-200 flex items-center justify-center gap-2 cursor-not-allowed&quot;;
                btnText.innerText = `${totalNeeded - count}개 좌석을 더 선택해 주세요`;
            }
        }

        // STEP 3 -&gt; STEP 4 (Card Payment Step)
        function goToPaymentStep() {
            const dep = document.getElementById(&#x27;departureStation&#x27;).value;
            const arr = document.getElementById(&#x27;arrivalStation&#x27;).value;

            document.getElementById(&#x27;paySummaryRoute&#x27;).innerText = `${dep} ➔ ${arr} (${selectedTrain.name})`;
            document.getElementById(&#x27;paySummarySeats&#x27;).innerText = selectedSeats.map(describeSeat).join(&#x27;, &#x27;);
            
            let passengerStr = [];
            if(passengers.adult &gt; 0) passengerStr.push(`성인 ${passengers.adult}`);
            if(passengers.child &gt; 0) passengerStr.push(`어린이 ${passengers.child}`);
            if(passengers.senior &gt; 0) passengerStr.push(`경로 ${passengers.senior}`);
            if(passengers.disabled &gt; 0) passengerStr.push(`장애인 ${passengers.disabled}`);
            document.getElementById(&#x27;paySummaryPassengers&#x27;).innerText = passengerStr.join(&#x27;, &#x27;);

            document.getElementById(&#x27;paySummaryTotal&#x27;).innerText = `${selectedTrain.price.toLocaleString()}원`;
            document.getElementById(&#x27;btnPayAmountText&#x27;).innerText = `안전 카드결제하기 (${selectedTrain.price.toLocaleString()}원)`;

            goToStep(4);
        }

        function togglePaymentInputs(type) {
            if (type === &#x27;card&#x27;) {
                document.getElementById(&#x27;cardPaymentForm&#x27;).classList.remove(&#x27;hidden&#x27;);
                document.getElementById(&#x27;easyPaymentForm&#x27;).classList.add(&#x27;hidden&#x27;);
            } else {
                document.getElementById(&#x27;cardPaymentForm&#x27;).classList.add(&#x27;hidden&#x27;);
                document.getElementById(&#x27;easyPaymentForm&#x27;).classList.remove(&#x27;hidden&#x27;);
            }
        }

        // STEP 4 -&gt; STEP 5 (Final Smart Ticket)
        function processFinalPayment() {
            const dep = document.getElementById(&#x27;departureStation&#x27;).value;
            const arr = document.getElementById(&#x27;arrivalStation&#x27;).value;
            const dateVal = document.getElementById(&#x27;travelDate&#x27;).value;

            document.getElementById(&#x27;ticketDepStation&#x27;).innerText = dep;
            document.getElementById(&#x27;ticketArrStation&#x27;).innerText = arr;
            document.getElementById(&#x27;ticketDepTime&#x27;).innerText = selectedTrain.depTime;
            document.getElementById(&#x27;ticketArrTime&#x27;).innerText = selectedTrain.arrTime;
            document.getElementById(&#x27;ticketTrainName&#x27;).innerText = selectedTrain.name;
            document.getElementById(&#x27;ticketDate&#x27;).innerText = dateVal;
            document.getElementById(&#x27;ticketSeats&#x27;).innerText = selectedSeats.map(describeSeat).join(&#x27;, &#x27;);
            
            let passengerStr = [];
            if(passengers.adult &gt; 0) passengerStr.push(`성인 ${passengers.adult}`);
            if(passengers.child &gt; 0) passengerStr.push(`어린이 ${passengers.child}`);
            if(passengers.senior &gt; 0) passengerStr.push(`경로 ${passengers.senior}`);
            if(passengers.disabled &gt; 0) passengerStr.push(`장애인 ${passengers.disabled}`);
            document.getElementById(&#x27;ticketPassengers&#x27;).innerText = passengerStr.join(&#x27;, &#x27;);
            
            document.getElementById(&#x27;ticketTotalPrice&#x27;).innerText = `${selectedTrain.price.toLocaleString()}원`;
            document.getElementById(&#x27;ticketBookingNo&#x27;).innerText = `예매번호: ${Math.floor(1000 + Math.random() * 9000)}-${Math.floor(1000 + Math.random() * 9000)}`;

            goToStep(5);
        }

        function resetApp() {
            passengers.adult = 1;
            passengers.child = 0;
            passengers.senior = 0;
            passengers.disabled = 0;
            selectedSeats = [];
            
            document.getElementById(&#x27;cntAdult&#x27;).innerText = 1;
            document.getElementById(&#x27;cntChild&#x27;).innerText = 0;
            document.getElementById(&#x27;cntSenior&#x27;).innerText = 0;
            document.getElementById(&#x27;cntDisabled&#x27;).innerText = 0;

            goToStep(1);
        }

        function showModal(msg) {
            document.getElementById(&#x27;modalText&#x27;).innerText = msg;
            document.getElementById(&#x27;modalOverlay&#x27;).classList.remove(&#x27;hidden&#x27;);
        }

        function closeModal() {
            document.getElementById(&#x27;modalOverlay&#x27;).classList.add(&#x27;hidden&#x27;);
        }
    &lt;/script&gt;

&lt;/body&gt;&lt;/html&gt;"></iframe><script>
function startRail(){document.getElementById('welcome').hidden=true;document.getElementById('railFrame').hidden=false;document.body.classList.remove('cover-mode');window.scrollTo(0,0);document.getElementById('railFrame').focus()}
function showCover(){document.getElementById('railFrame').hidden=true;document.getElementById('welcome').hidden=false;document.body.classList.add('cover-mode');window.scrollTo(0,0);document.querySelector('#welcome h1')?.focus()}
</script></body></html>
